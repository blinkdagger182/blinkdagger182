<div class="table-responsive">
    <!--*ngIf="!loading&&pagedItems.length>0"-->
    <table class="table table-striped  table-hover table-sm m-table m-table--head-bg-brand tableHeader">
        <thead class="thead-inverse">
            <tr>
                <th>Id</th>
                <th>Project Name</th>
                <th>Timeline</th>
                <th>Project Leader</th>
                <th>Owner</th>
                <th width="15%">Status</th>
                <th></th>
            </tr>
            <!--<tr>
                        <th *ngIf="showAdvId">
                            <input class="form-control form-control-sm" name="termAdvId" [(ngModel)]="termAdvId">
                        </th>
                        <th *ngIf="showPosId">
                            <input class="form-control form-control-sm" name="termPosId" [(ngModel)]="termPosId">
                        </th>
                        <th *ngIf="showPosName">
                            <input class="form-control form-control-sm" name="termPosName" [(ngModel)]="termPosName">
                        </th>
                        <th *ngIf="showLOB">
                            <input class="form-control form-control-sm" name="termLOB" [(ngModel)]="termLOB">
                        </th>
                        <th *ngIf="showAct"></th>
                    </tr> -->
        </thead>
        <tbody>
            <tr scope="row" *ngFor="let item of pagedItems">
                <!--summDataApprHist-->
                <td>{{item.ref}}</td>
                <td>{{item.name}}</td>
                <td>{{item.project_start | date:'dd MMM yyyy'}} - {{item.project_close | date:'dd MMM yyyy'}} </td>
                <td>{{item.leader_name}}</td>
                <td>{{item.creator_name}}</td>
                <td>
                    <!--  class="text-right" -->
                    <div class="btn-group btn-group-toggle align-text-top  justify-content-end " data-toggle="buttons">
                        <div class="m-demo__preview m-demo__preview--btn" >

                            <span style="width:9rem !important" class="m-badge m-badge--{{getStatusColor(item.status)}} m-badge--wide" title="{{item.status}}">
                                {{item.status_text}}</span>
                        </div>
                    </div>
                </td>
                <td>
                    <div class="btn-group btn-group-toggle align-text-top  justify-content-end " data-toggle="buttons">
                        <div class="m-demo__preview m-demo__preview--btn">
                            <button title="Info" class="btn btn-outline-primary  m-btn m-btn--icon btn-sm m-btn--icon-only m-btn--pill m-btn--air"
                                (click)="exorShowDetails(item.id)">
                                <i class="fa fa-info-circle"></i>
                            </button>
                        </div>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>


</div>

<nav aria-label="Page navigation example" *ngIf="pager.pages && pager.pages.length>1">
    <ul *ngIf="pager.pages && pager.pages.length" class="pagination justify-content-end">
        <li class="page-item" [ngClass]="{disabled:pager.currentPage === 1}">
            <button (click)="setPage(1)" class="page-link" href="#" aria-label="Previous">
                <span aria-hidden="true">&laquo;</span>
                <span class="sr-only">First</span>
            </button>
        </li>
        <li class="page-item" [ngClass]="{disabled:pager.currentPage === 1}">
            <button (click)="setPage(pager.currentPage - 1)" class="page-link" href="#" aria-label="Previous">
                <span aria-hidden="true">&lt;</span>
                <span class="sr-only">Previous</span>
            </button>
        </li>
        <li class="page-item" *ngFor="let page of pager.pages" [ngClass]="{active:pager.currentPage === page}">
            <button (click)="setPage(page)" class="page-link" href="#">{{page}}</button>
        </li>
        <li class="page-item" [ngClass]="{disabled:pager.currentPage === pager.totalPages}">
            <button (click)="setPage(pager.currentPage + 1)" class="page-link" href="#" aria-label="Previous">
                <span aria-hidden="true">&gt;</span>
                <span class="sr-only">Next</span>
            </button>
        </li>
        <li class="page-item" [ngClass]="{disabled:pager.currentPage === pager.totalPages}">
            <button (click)="setPage(pager.totalPages)" class="page-link" href="#" aria-label="Next">
                <span aria-hidden="true">&raquo;</span>
                <span class="sr-only">Last</span>
            </button>
        </li>
    </ul>
</nav>

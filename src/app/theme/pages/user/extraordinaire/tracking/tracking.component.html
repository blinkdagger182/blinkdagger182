<div *ngIf="summDataTracking">
    <nav aria-label="Page navigation example" *ngIf="pager.pages && pager.pages.length>1">
        <ul *ngIf="pager.pages && pager.pages.length" class="pagination justify-content-end">
            <li class="page-item" [ngClass]="{disabled:pager.currentPage === 1}">
                <button (click)="setPage(1)" class="page-link" href="#" aria-label="Previous">
                    <span aria-hidden="true">&laquo;</span>
                    <span class="sr-only">First</span>
                </button>
            </li>
            <li class="page-item" [ngClass]="{disabled:pager.currentPage === 1}">
                <button (click)="setPage(pager.currentPage - 1)" class="page-link" href="#" aria-label="Previous">
                    <span aria-hidden="true">&lt;</span>
                    <span class="sr-only">Previous</span>
                </button>
            </li>
            <li class="page-item" *ngFor="let page of pager.pages" [ngClass]="{active:pager.currentPage === page}">
                <button (click)="setPage(page)" class="page-link" href="#">{{page}}</button>
            </li>
            <li class="page-item" [ngClass]="{disabled:pager.currentPage === pager.totalPages}">
                <button (click)="setPage(pager.currentPage + 1)" class="page-link" href="#" aria-label="Previous">
                    <span aria-hidden="true">&gt;</span>
                    <span class="sr-only">Next</span>
                </button>
            </li>
            <li class="page-item" [ngClass]="{disabled:pager.currentPage === pager.totalPages}">
                <button (click)="setPage(pager.totalPages)" class="page-link" href="#" aria-label="Next">
                    <span aria-hidden="true">&raquo;</span>
                    <span class="sr-only">Last</span>
                </button>
            </li>
        </ul>
    </nav>
</div>

<div class="modal fade" id="m_modal_action" tabindex="-1" role="dialog" aria-labelledby="advertiseModalCenterTitle"
    aria-hidden="true" style="display: none;">
    <div class="modal-dialog modal-dialog-centered modal-lg" role="document" style="justify-content:center;">
        <form [formGroup]="actionForm">
            <div class="modal-content" style="width: 525px; border-radius:25px;">
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLongTitle">
                        Are you sure to {{clickAct}} this advertisement?
                    </h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">
                            ×
                        </span>
                    </button>
                </div>
                <div class="modal-body">
                    <!-- :start NOTIFICATION V2  
                    <div class="m-alert m-alert--icon m-alert--outline alert alert-warning alert-dismissible fade show"
                        role="alert" *ngIf="showFormErr"> 
                        <div class="m-alert__icon">
                            <i class="la la-thumbs-o-up"></i>  
                        </div>
                        <div class="m-alert__text">
                            ::advErrMsg:: 
                        </div>
                    </div>
                     :end NOTIFICATION V2 -->
                    <div class="m-form__section m-form__section--first">
                        <div class="form-group m-form__group row justify-content-center mr-3 ml-3" [hidden]="!apprRemark">
                            <label for="example-text-input" class="col-lg-12 col-form-label">Remarks
                                <span *ngIf="apprRemark">*</span>
                            </label>
                            <div class="col-lg-12">
                                <textarea id="remarks" #rmk class="form-control m-input m-input--air m-input--pill"
                                    formControlName="projRemark" [required]="apprRemark" rows="8"></textarea>
                                <!--
                                <p class="error_message" style="color:red" *ngIf="apprRemark && (actionForm.get('projRemark').value=='')">Required.
									<span class="error_message" style="color:red" *ngIf="(actionForm.get('projRemark').hasError('required') && (actionForm.get('projRemark').dirty))">Please
										add some remarks.</span>
                                </p> -->
                                <span class="m-form__help error_message" style="color:red" [ngStyle]="{'color': (actionForm.get('projRemark').hasError('required') && (actionForm.get('projRemark').dirty))? 'red' : 'black'}"
                                    *ngIf="apprRemark">
                                    Required. Please add some remarks.
                                </span>
                                <input type="hidden" formControlName="projId" required>
                                <input type="hidden" formControlName="projActTaken" required value="{{projActTaken}}">
                            </div>
                        </div>

                        <!-- ::start adv period -->
                        <div class="m-form__seperator m-form__seperator--dashed"></div>
                        <!-- <div class="m-form__section m-form__section--last" *ngIf="!apprRemark"> -->
                        <div class="m-form__section m-form__section--last" [hidden]="!apprDate">
                            <div class="form-group m-form__group row">
                                <label for="example-text-input" class="col-3 col-form-label">Advertisement
                                    <br />Period*</label>
                                <div class="col-9">
                                    <div class="input-daterange input-group  m-input-group  m-input-group--pill" id="m_datepicker_5">
                                        <input type="text" class="form-control m-input" name="start" id="st" readonly
                                            value="{{myStartDt | date: 'dd-MM-yyyy'}}" />
                                        <div class="input-group-append">
                                            <span class="input-group-text">
                                                <i class="la la-ellipsis-h"></i>
                                            </span>
                                        </div>
                                        <input type="text" class="form-control" name="end" id="et" readonly value="{{myEndDt | date: 'dd-MM-yyyy'}}" />
                                    </div>
                                    <p class="error_message" style="color:red" *ngIf="advDateError.isError">{{advDateError.errorMessage}}</p>
                                    <span class="m-form__help">
                                        {{msgAdvPeriod}}
                                    </span>
                                </div>
                            </div>
                            <!-- ::end adv period -->
                        </div>
                        <div class="row" *ngIf="formMsg">
                            <div class="col-12">
                                <div *ngIf="processingReq" class="m-alert m-alert--icon m-alert--outline alert alert-primary alert-dismissible fade show"
                                    role="alert">
                                    <div class="m-alert__icon">
                                        <div class="m-loader m-loader--primary" style="width: 30px; display: inline-block;">
                                        </div> Processing Request ...
                                    </div>
                                </div>
                                <div *ngIf="showFormMsg" class="m-alert m-alert--icon m-alert--outline alert alert-{{formMsgColor}} alert-dismissible fade show"
                                    role="alert">
                                    <div class="m-alert__icon">
                                        <i class="la {{formMsgIcon}}"></i>
                                    </div>
                                    <div class="m-alert__text">
                                        {{advErrMsg}}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">

                    <input type="hidden" required class="form-control m-input hide-adv-date" name="start" id="startDate2"
                        (focus)="compareTwoDates()" />
                    <!--formControlName="dtStart"-->
                    <input type="hidden" required class="form-control hide-adv-date" name="end" id="endDate2" (focus)="compareTwoDates()" />
                    <!--formControlName="dtEnd"-->
                    <div *ngIf="showActButton">
                        <button (click)="actionFormSubmit()" style="visibility:hidden" id="btnMyAction2" [disabled]="(apprRemark&&(rmk.value.trim()) == '')"
                            type="submit">
                            Confirm Hidden
                        </button>
                        <button type="button" class="btn btn-sm btn-secondary m-btn m-btn--icon m-btn--pill m-btn--wide pull-right"
                            data-dismiss="modal">
                            Close
                        </button>
                        <button id="btnMyAction" type="submit" class="btn btn-sm btn-brand m-btn m-btn--icon m-btn--pill m-btn--wide pull-right"
                            [disabled]="(apprRemark&&(rmk.value.trim()) == '')">
                            <!--onclick="$('.modal').modal('hide')" -->
                            Confirm
                        </button>
                    </div>
                    <div *ngIf="closeReload">
                        <button id="btnMyCloseReload" type="button" class="btn btn-sm btn-brand m-btn m-btn--icon m-btn--pill m-btn--wide pull-right"
                            (click)="btnMyCloseReload()" onclick="$('.modal').modal('hide')">
                            Close
                        </button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
<!--end::resubmit/withdraw modal-->

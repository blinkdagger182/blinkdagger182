<div>
    <div class="page-bg happy-bg">
        <h2 class="head-sub-title">Happy Meter</h2>
    </div>
    <div class="pg-title-div">
        <h3 class="pg-title">HAPPY METER</h3>
    </div>
</div>

<div class="text-center"> 
    <div class="row pt-0">
        <div class="col-sm-12" style="padding-bottom: 2rem;">
            <div class="m-subheader">
                <div class="d-flex align-items-center">
                    <div class="mr-auto">
                        
                        <button title="Back" style="color: white !important" 
                            [style.background-color]="getColor()" 
                            class="btn m-btn--pill pt-1 pb-1 pr-3 pl-3"
                            (click)="btnBackClick()">
                            <div class="m-demo-icon__preview" style="display: flex; align-items: center;">
                                <img style="width:2rem !important" src="../../../../../../assets/img/user/back_icon.svg">
                                <span>Back</span>
                            </div>
                        </button>
                    </div>
                </div>
            </div>

            <div *ngIf="feelNum > 0">
                <div class="feel_today feel_today_400">What makes you feel <span class="weight_600" [style.color]="getColor()">'{{getFeelText()}}'</span>?</div>
                
                <div class="selectOne">Please select one :</div>

            </div>

            <div class="centred my-auto" *ngIf="feelNum > 0 && loading">
                <app-user-loading></app-user-loading>
            </div>

            <div *ngIf="feelNum > 0 && !loading" class="row" style="margin-top: 2rem; margin-right: 1rem; margin-left: 1rem">

                <div class="col-lg-4" >
                    <div class="m-portlet smily_card" [style.background-color]="getColor()"> 
                        <div class="m-portlet__body" style="padding: 1.2rem 1.2rem !important;">
                            <img [src]="getIcon()" class="img-feel" >
                        </div>
                        <div class="card_text" style="color: white !important">
                            {{getFeelText()}} 
                        </div>
                    </div>
                </div>
                

                <div class="col-lg-6">
                        <span class="m-form__help date_help errMsg m--hide" id="errReason">
                            <p>Please choose one of these reasons.</p>
                        </span>

                        <div class="m-demo__preview m-demo__preview--btn">
                            <button type="button" id="resBtn_{{i}}" *ngFor="let res of reasons; let i = index" style="margin:0.5rem !important; border-width:1px !important"
                                [ngClass]="getClass()" (click)="reasonClicked(res.id, i)"
                                class="btn m-btn--pill m-btn m-btn--outline-2x ">
                                {{res.reason}}
                            </button>
                        </div>
                        <br>
                        <span class="m-form__help date_help errMsg m--hide" id="errRemark">
                            <p>Please enter your remark.</p>
                        </span>

                        <textarea class="form-control m-input m-input--air" [style.border-color]="getColor()"
                            (keyup) = "keyInRemark()"
                            placeholder="Tell us more on your feeling and what can be done to make you happier?." 
                            id="feel_note" rows="7"></textarea>

                        <br>
                        <button type="button" (click)="submit_feeling()" [style.background-color]="getColor()"
                            class="submit-feel btn m-btn m-btn--pill m-btn--air">
                            Done
                        </button>

                        <button  class="m--hide" type="button" data-toggle="modal" data-target="#thankyou" data-backdrop="static" data-keyboard="false" id="thank-btn">
                            Thank you
                        </button>
                </div>
            </div>
            
        </div>

        <div class="modal fade" id="thankyou" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" style="display: none;" aria-hidden="true">
            <div class="modal-dialog modal-sm modal-dialog-centered" role="document" style="max-width: 500px !important; margin: auto !important">
                <div class="modal-content" style="padding-top: 55px; padding-bottom: 55px;">
                    <div class="modal-header" style="padding: 0px !important; border-bottom:none !important ">
                        <div class="modal-title" style="margin:auto !important" id="exampleModalLabel">
                            
                            <div class="m-section__content">
                                <div class="m-demo thanksNote" data-code-preview="true" data-code-html="true" data-code-js="false">
                                    <div class="m-demo__preview" [style.border-color]="getColor()">
                                        
                                        <img [src]="getIcon()" style="width:20% !important" >
                                        <br>
                                        <div class="sharing" [style.color]="getColor()">
                                            Thank you for sharing!
                                        </div>
                                        
                                        <div class="selectOne" style="font-size: 1.2rem !important; width:70%; margin:auto">
                                            "Happiness comes in waves. It'll find you again."
                                        </div>

                                        <button type="button" [style.background-color]="getColor()" data-dismiss="modal"
                                            (click)="thanksCloseClicked()"
                                            class="thanks-close-btn btn m-btn m-btn--pill m-btn--air">
                                            Close
                                        </button>
                                    </div>
                                </div>
                            </div>
                            
                        </div>
                    </div>
                    
                    <div class="modal-footer" style="display: none">
                        <div style="width: 100% !important; text-align: center !important">
                            <button type="button" id="cancel_btn" style="margin-right: 3rem !important" class="btn btn-secondary" data-dismiss="modal">
                                cancel
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
    </div>
</div>

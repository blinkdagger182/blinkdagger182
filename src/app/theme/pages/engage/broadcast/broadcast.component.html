
<!-- START: Subheader -->
<div class="m-subheader" appunwraptag="">
    <div class="d-flex align-items-center">
        <div class="mr-auto">
            <h3 class="m-subheader__title m-subheader__title--separator">
                Happy Meter
            </h3>
            <ul class="m-subheader__breadcrumbs m-nav m-nav--inline">
                
                <li class="m-nav__item">
                    <span class="m-nav__link-text" style="font-size: 16px">
                        Broadcast
                    </span>
                </li>
            </ul>
        </div>
    </div>
</div>
<!-- END: Subheader -->


<div class="m-content">
    <div class="row">
        <!-- :start page loader -->
        <div class="col-lg-12 centred my-auto" *ngIf="loading">
            <div class="m-section__content">
                <div class="m-demo" data-code-preview="true" data-code-html="true" data-code-js="false">
                    <div class="m-demo__preview">
                        <div class="m-stack m-stack--ver m-stack--general m-stack--demo">

                            <div class="m-stack__item m-stack__item--center m-stack__item--middle">
                                <span>
                                    Loading data. Please wait...
                                </span>
                                <span>
                                    <div class="m-loader m-loader--lg m-loader--success" style="width: 30px; display: inline-block;"></div>
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- end::Page loader -->

        <div class="col-lg-12" *ngIf="!loading">
            <!--begin::Portlet-->
            <!--<div class="m-portlet m-portlet--full-height">-->
            <div class="m-portlet m-portlet--rounded m-portlet--full-height">
                <div class="m-portlet__head m--bg-focus" style="background: #FF5A00!important">
                    <div class="m-portlet__head-caption">
                        <div class="m-portlet__head-title">
                            <span class="m-portlet__head-icon m--hide">
                                <i class="la la-gear"></i>
                            </span>
                            <h3 class="m-portlet__head-text m--font-inverse-primary" style="font-size: 18px">
                                {{bMTitle}}
                            </h3>
                        </div>
                    </div>
                </div>
                <!--begin::Form-->
                <form class="m-form" [formGroup]="broadcastMsgForm"> <!--  (ngSubmit)="broadcastMsgFormSubmit()"-->
                    <div class="m-portlet__body">
                        <div class="m-form__section m-form__section--first">
                            <div class="form-group m-form__group row">
                                <div class="col-lg-12">
                                    <div *ngIf="bcShowMsg" class="m-alert m-alert--icon m-alert--outline alert {{advPosStyle}} alert-dismissible fade show"
                                        role="alert">
                                        <div class="m-alert__icon">
                                            <i class="{{advPosIcon}}"></i>
                                        </div>
                                        <div class="m-alert__text">
                                            {{advPosMsg}}
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="form-group m-form__group row pl-3 pr-3">
                                <label class="col-lg-2 col-form-label">
                                    Type of Broadcast: 
                                </label>
                                <div class="col-lg-10">
                                    <select name="type" id="type" class="form-control m-input" (change)="typeChange()" formControlName="bcType">                                        
                                        <option value="default" selected disabled>-- Select broadcast type --</option>
                                        <option *ngIf="enAdmin" value="all">All</option>
                                        <option *ngIf="enAdmin" value="lob">By LOB</option>
                                        <option *ngIf="enAdmin" value="single">Single</option>

                                        <option *ngIf="enUser" value="lob">By LOB</option>
                                    </select>
                                </div>
                            </div>
                            <!-- <div class="form-group m-form__group row pl-3 pr-3">
                                <label class="col-lg-2 col-form-label">
                                    Class: 
                                </label>
                                <div class="col-lg-10">
                                    <select name="type" id="type" class="form-control m-input" (change)="classChange()" formControlName="bcClass">
                                        <option value="default" selected disabled>-- Select broadcast class --</option>
                                        <option value="normal">Normal</option>
                                        <option value="url">Url</option>
                                        <option value="happymeter">Happy meter</option>
                                    </select>
                                </div>
                            </div> -->
                            <div class="form-group m-form__group row pl-3 pr-3" *ngIf="single">
                                <label class="col-lg-2 col-form-label">
                                    Staff Id:
                                </label>
                                <div class="col-lg-10">
                                    <div class="m-stack__item m-stack__item--center m-stack__item--middle" *ngIf="loadingStaffId">
                                        <span>
                                            Loading data. Please wait...
                                        </span>
                                        <span>
                                            <div class="m-loader m-loader--lg m-loader--success" style="width: 30px; display: inline-block;"></div>
                                        </span>
                                    </div>

                                    <input #selectedStaff placeholder="Select Target Staff" type="text" ng-model="search" class="form-control m-input"
                                        list="bcStaffIdList" [required]="bcMethod==1" formControlName="bcStaffId" *ngIf="!loadingStaffId">
                                    <datalist id="bcStaffIdList" [hidden]="true" *ngIf="!loadingStaffId">
                                        <option value="" disabled selected>Select Target Staff</option>
                                        <option *ngFor="let item of optReqList2" value="{{item}}"></option>
                                    </datalist> 
                                </div>
                            </div>
                            <!-- <div class="form-group m-form__group row pl-3 pr-3" *ngIf="url">
                                <label class="col-lg-2 col-form-label">
                                    URL: 
                                </label>
                                <div class="col-lg-10">
                                    <input type="text" class="form-control m-input" placeholder="Enter Url"
                                        formControlName="bcUrl" required #bcUrl>
                                </div>
                            </div> -->
                            <div class="form-group m-form__group row pl-3 pr-3" *ngIf="lob">
                                <label class="col-lg-2 col-form-label">
                                    LOB:
                                </label>
                                <div class="col-lg-10">
                                    <div class="m-stack__item m-stack__item--center m-stack__item--middle" *ngIf="loadingLobs">
                                        <span>
                                            Loading data. Please wait...
                                        </span>
                                        <span>
                                            <div class="m-loader m-loader--lg m-loader--success" style="width: 30px; display: inline-block;"></div>
                                        </span>
                                    </div>

                                    <select #searchLOB class="form-control m-input" [hidden]="loadingLob" formControlName="bcLob">
                                        <option value="" disabled selected>-- Select Target LOB --</option>
                                        <option *ngFor="let item of lobList" value="{{item}}">{{item}}</option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-group m-form__group row pl-3 pr-3">
                                <label class="col-lg-2 col-form-label">
                                    Title: 
                                </label>
                                <div class="col-lg-10">
                                    <input type="text" maxlength="99" class="form-control m-input" placeholder="Enter title"
                                        formControlName="bcTitle" required #bcTitle>
                                    <span class="m-form__help">
                                        {{ttlMax - bcTitle.value.trim().length}} remaining character<span *ngIf="ttlMax - bcTitle.value.trim().length>1">s</span>
                                    </span>
                                </div>
                            </div>
                            <div class="form-group m-form__group row pl-3 pr-3">
                                <label class="col-lg-2 col-form-label">
                                    Message:
                                </label>
                                <div class="col-lg-10">
                                    <textarea formControlName="bcMsg" maxlength="256" required #message class="form-control m-input"
                                        id="exampleTextarea" rows="5" placeholder="Enter message"></textarea>
                                    <span class="m-form__help">
                                        {{msgMax - message.value.trim().length}} remaining character<span *ngIf="msgMax - message.value.trim().length>1">s</span>
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="m-portlet__foot m-portlet__foot--fit">
                        <div class="m-form__actions m-form__actions">
                            <div class="row">
                                <div class="col-lg-2"></div>
                                <div class="col-lg-10  text-right">
                                    <button id="bcMsgToUsr2" style="visibility: hidden" (click)="broadcastMsgFormSubmit()"  type="button" class="btn btn-primary"
                                        onclick="$('.modal').modal('hide')">
                                        Submit 2
                                    </button>
                                    <button type="reset" class="btn btn-secondary">
                                        Cancel
                                    </button>
                                    <button id="bcMsgToUsr" [disabled]="loadingSubmit" type="button" class="btn btn-primary" [ngClass]="{disabled: broadcastMsgForm.get('bcType').value === 'default'}">
                                        Submit
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div class="m-content">
    <div class="row">
        <!-- :start page loader -->
        <div class="col-lg-12 centred my-auto" *ngIf="loading">
            <div class="m-section__content">
                <div class="m-demo" data-code-preview="true" data-code-html="true" data-code-js="false">
                    <div class="m-demo__preview">
                        <div class="m-stack m-stack--ver m-stack--general m-stack--demo">

                            <div class="m-stack__item m-stack__item--center m-stack__item--middle">
                                <span>
                                    Loading data. Please wait...
                                </span>
                                <span>
                                    <div class="m-loader m-loader--lg m-loader--success" style="width: 30px; display: inline-block;"></div>
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- end::Page loader -->

        <div class="col-lg-12" *ngIf="!loading">
            <!--begin::Portlet-->
            <div class="m-portlet m-portlet--full-height">
                <!--begin::Section-->
                <div class="m-accordion m-accordion--bordered" id="m_accordion_1" role="tablist">
                    <!-- :start section 1 -->
                    <div class="m-accordion__item">
                        <div class="m-accordion__item-head" role="tab" id="m_accordion_adv_info_head" data-toggle="collapse"
                            href="#m_accordion_adv_info_body" aria-expanded="    false">
                            <span class="m-accordion__item-mode"></span>
                            <span class="m-accordion__item-title m-accordian__item-mode-title pl-2">
                                {{section1}}
                            </span>
                            <span class="m-accordion__item-icon">
                                <i class="fa flaticon-clipboard"></i>
                            </span>
                        </div>
                        <div class="m-accordion__item-body  show" id="m_accordion_adv_info_body" role="tabpanel"
                            aria-labelledby="m_accordion_adv_info_head">
                            <div class="m-accordion__item-content">
                                <div class="col-lg-12 centred my-auto">
                                    <!-- <ng-template #alertErrorSec2></ng-template> -->
                                </div>

                                <div *ngIf="loading">
                                    <span>Loading data. Please wait... </span>
                                    <span>
                                        <div class="m-loader m-loader--lg m-loader--success" style="width: 30px; display: inline-block;"></div>
                                    </span>
                                </div>

                                <div *ngIf="!loading&&!err">
                                    <div class="row">
                                        <div class="col-lg-12 text-right">
                                            <button type="button" class="btn btn-primary m-btn m-btn--icon m-btn--icon-only m-btn--custom m-btn--pill" data-toggle="modal" data-target="#modal_new_app_ver">
                                                <i class="fa flaticon-add-circular-button"></i>
                                            </button>
                                        </div>
                                    </div>
                                    <div class="row table-responsive">
                                        <div class="col-lg-12">
                                            <table class="table table-striped table-hover m_datatable">
                                                <thead class="thead-inverse">
                                                    <tr>
                                                        <th>Id</th>
                                                        <th>Version</th>
                                                        <th>Creator</th>
                                                        <th>Status</th>
                                                        <th style="width:20px"></th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    <tr *ngFor="let ver of pagedItemsAppVer">
                                                        <td>{{ver.id}}</td>
                                                        <td>{{ver.version}}</td>
                                                        <td>{{ver.creator}}</td>
                                                        <td>
                                                            <span *ngIf="ver.valid === 1 || ver.valid === true" class="m-badge m-badge--success m-badge--wide">Enabled</span>
                                                            <span *ngIf="ver.valid === 0 || ver.valid === false" class="m-badge m-badge--danger m-badge--wide">Disabled</span>
                                                        </td>
                                                        <td class="d-flex flex-row">
                                                            <!-- <button href="#" class="m-portlet__nav-link btn m-btn m-btn--hover-danger m-btn--icon m-btn--icon-only m-btn--pill"
                                                                title="Delete" id="closeAds2" style="visibility: hidden" (click)="closeAdsSubmit()">
                                                                <i class="la la-trash"></i>
                                                            </button>
                                                            <a href="#" class="m-portlet__nav-link btn btn-success m-btn--pill"
                                                                title="Delete" id="closeAds" (click)="selectedVer(ver)">
                                                                Enable
                                                            </a> -->
                                                            <div class="col-3" style="height: 30px">
                                                                <span class="m-switch m-switch--icon">
                                                                    <label>
                                                                        <input type="checkbox" [(ngModel)]="ver.valid" (change)="appVersionToggle(ver)">
                                                                        <span></span>
                                                                    </label>
                                                                </span>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-12">
                                            <nav aria-label="Page navigation example">
                                                <ul *ngIf="pagerAppVer.pages && pagerAppVer.pages.length" class="pagination justify-content-end">
                                                    <li class="page-item" [ngClass]="{disabled:pagerAppVer.currentPage === 1}">
                                                        <button (click)="setPageAppVer(1)" class="page-link" href="#"
                                                            aria-label="Previous">
                                                            <span aria-hidden="true">&laquo;</span>
                                                            <span class="sr-only">First</span>
                                                        </button>
                                                    </li>
                                                    <li class="page-item" [ngClass]="{disabled:pagerAppVer.currentPage === 1}">
                                                        <button (click)="setPageAppVer(pagerAppVer.currentPage - 1)" class="page-link"
                                                            href="#" aria-label="Previous">
                                                            <span aria-hidden="true">&lt;</span>
                                                            <span class="sr-only">Previous</span>
                                                        </button>
                                                    </li>
                                                    <li class="page-item" *ngFor="let page of pagerAppVer.pages" [ngClass]="{active:pagerAppVer.currentPage === page}">
                                                        <button (click)="setPageAppVer(page)" class="page-link" href="#">{{page}}</button>
                                                    </li>
                                                    <li class="page-item" [ngClass]="{disabled:pagerAppVer.currentPage === pagerAppVer.totalPages}">
                                                        <button (click)="setPageAppVer(pagerAppVer.currentPage + 1)" class="page-link"
                                                            href="#" aria-label="Previous">
                                                            <span aria-hidden="true">&gt;</span>
                                                            <span class="sr-only">Next</span>
                                                        </button>
                                                    </li>
                                                    <li class="page-item" [ngClass]="{disabled:pagerAppVer.currentPage === pagerAppVer.totalPages}">
                                                        <button (click)="setPageAppVer(pagerAppVer.totalPages)" class="page-link"
                                                            href="#" aria-label="Next">
                                                            <span aria-hidden="true">&raquo;</span>
                                                            <span class="sr-only">Last</span>
                                                        </button>
                                                    </li>
                                                </ul>
                                            </nav>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- :end section 1 -->
                </div>
            </div>
        </div>
    </div>
</div>

<!-- :start Add/Update Modal -->
<div class="modal fade" id="modal_new_app_ver" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <form [formGroup]="addNewVerForm">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel">
                        Add New App Version
                    </h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">
                            &times;
                        </span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="message-text" class="form-control-label">
                            Name:
                        </label>
                        <input class="form-control m-input"  required (keyup)="onNameKeyUp($event)" formControlName="eavName" placeholder="Type in the name"> 
                    </div>
                    <div class="form-group">
                        <label for="message-text" class="form-control-label">
                            Status:
                        </label>
                        <select class="form-control m-input" formControlName="eavValid">
                            <option value="" disabled selected>Select status</option>
                            <option value="1" >Enable</option>
                            <option value="0" >Disable</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal" (click)="resetForm()">
                        Close
                    </button>
                    <button [disabled]="!addNewVerForm.valid" type="submit" class="btn btn-primary" onclick="$('.modal').modal('hide')" (click)="appVersionAdd()"> 
                        Save
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
<!-- :end Add/Update Modal -->

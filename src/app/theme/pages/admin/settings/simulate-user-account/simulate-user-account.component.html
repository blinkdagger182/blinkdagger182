<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.2.13/semantic.min.css">

<notifier-container></notifier-container>
<!-- START: Subheader -->
<div class="m-subheader" appunwraptag="">
    <div class="d-flex align-items-center">
        <div class="mr-auto">
            <h3 class="m-subheader__title m-subheader__title--separator">
                {{title1}}
            </h3>
            <ul class="m-subheader__breadcrumbs m-nav m-nav--inline">
                <li class="m-nav__item m-nav__item--home">
                    <a routerLink="/admin/index" class="m-nav__link m-nav__link--icon">
                        <i class="m-nav__link-icon la la-home"></i>
                    </a>
                </li>
                <li class="m-nav__item">
                    <a href="" class="m-nav__link">
                        <span class="m-nav__link-text">
                            <!-- {{SuaTitle}} -->
                        </span>
                    </a>
                </li>
            </ul>
        </div>
        <div>
            <div class="m-dropdown m-dropdown--inline m-dropdown--arrow m-dropdown--align-right m-dropdown--align-push"
                m-dropdown-toggle="hover" aria-expanded="true">
            </div>
        </div>
    </div>
</div>
<!-- END: Subheader -->


<div class="m-content">
    <div class="row">
        <div class="col-lg-12">
            <!--begin::Portlet-->
            <div class="m-portlet m-portlet--full-height">
                <!--begin::Section-->
                <div class="m-accordion m-accordion--bordered" id="m_accordion_1" role="tablist">
                    <!-- :start section -->
                    <div class="m-accordion__item">
                        <div class="m-accordion__item-head" role="tab" id="m_accordion_sec1_head" data-toggle="collapse"
                            href="#m_accordion_sec1_body" aria-expanded="    false">
                            <span class="m-accordion__item-mode"></span>
                            <span class="m-accordion__item-title m-accordian__item-mode-title pl-2">
                                {{pageTitle}}
                            </span>
                            <span class="m-accordion__item-icon">
                                <i class="fa {{titleIcon}}"></i>
                            </span>
                        </div>
                        <div class="m-accordion__item-body  show" id="m_accordion_sec1_body" role="tabpanel"
                            aria-labelledby="m_accordion_sec1_head" data-parent="#m_accordion_1">
                            <div class="m-accordion__item-content">
                                <div *ngIf="loading1">
                                    <span>Loading data. Please wait... </span>
                                    <span>
                                        <div class="m-loader m-loader--lg m-loader--success"
                                            style="width: 30px; display: inline-block;"></div>
                                    </span>
                                </div>

                                <div *ngIf="!loading1&&!err1">
                                    <div class="row">
                                        <div class="col-lg-12 text-right">
                                            <button type="button" class="btn m-btn--pill btn-primary btn-sm"
                                                data-toggle="modal"                                               
                                                data-target="#modal_new_SUA_user">
                                                <i class="fa {{titleIcon}}"></i> Add new user
                                            </button>
                                        </div>
                                    </div>
                                    <div class="row table-responsive">
                                        <div class="col-lg-12">
                                            <table class="table table-striped table-hover m_datatable">
                                                <thead class="thead-inverse">
                                                    <tr>
                                                        <th>Staff Id</th>
                                                        <th>Update by</th>
                                                        <th>Date Insert On</th>
                                                        <th style="width:20px"></th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    <tr *ngFor="let adm of pagedItemsAdm">
                                                        <td>{{adm.user_id}}</td>
                                                        <td>{{adm.update_by}}</td>
                                                        <td>{{adm.insert_on | date:'dd MMM yyyy'}}</td>
                                                        <td class="d-flex flex-row">
                                                             <button href="#"
                                                                class="m-portlet__nav-link btn m-btn m-btn--hover-danger m-btn--icon m-btn--icon-only m-btn--pill"
                                                                title="Delete" id="delJobUsr2"
                                                                style="visibility: hidden" (click)="delUser()">
                                                                <i class="la la-trash"></i>
                                                            </button>
                                                            <a href="#"
                                                                class="m-portlet__nav-link btn m-btn m-btn--hover-danger m-btn--icon m-btn--icon-only m-btn--pill"
                                                                title="Delete" id="delJobUsr"
                                                                (click)="selectedUser(adm)">
                                                                <i class="la la-trash"></i>
                                                            </a>
                                                        </td>
                                                    </tr>
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-12">
                                            <nav aria-label="Page navigation example">
                                                <ul *ngIf="pagerAdm.pages && pagerAdm.pages.length"
                                                    class="pagination justify-content-end">
                                                    <li class="page-item"
                                                        [ngClass]="{disabled:pagerAdm.currentPage === 1}">
                                                        <button (click)="setPageAdm(1)" class="page-link" href="#"
                                                            aria-label="Previous">
                                                            <span aria-hidden="true">&laquo;</span>
                                                            <span class="sr-only">First</span>
                                                        </button>
                                                    </li>
                                                    <li class="page-item"
                                                        [ngClass]="{disabled:pagerAdm.currentPage === 1}">
                                                        <button (click)="setPageAdm(pagerAdm.currentPage - 1)"
                                                            class="page-link" href="#" aria-label="Previous">
                                                            <span aria-hidden="true">&lt;</span>
                                                            <span class="sr-only">Previous</span>
                                                        </button>
                                                    </li>
                                                    <li class="page-item" *ngFor="let page of pagerAdm.pages"
                                                        [ngClass]="{active:pagerAdm.currentPage === page}">
                                                        <button (click)="setPageAdm(page)" class="page-link"
                                                            href="#">{{page}}</button>
                                                    </li>
                                                    <li class="page-item"
                                                        [ngClass]="{disabled:pagerAdm.currentPage === pagerAdm.totalPages}">
                                                        <button (click)="setPageAdm(pagerAdm.currentPage + 1)"
                                                            class="page-link" href="#" aria-label="Previous">
                                                            <span aria-hidden="true">&gt;</span>
                                                            <span class="sr-only">Next</span>
                                                        </button>
                                                    </li>
                                                    <li class="page-item"
                                                        [ngClass]="{disabled:pagerAdm.currentPage === pagerAdm.totalPages}">
                                                        <button (click)="setPageAdm(pagerAdm.totalPages)"
                                                            class="page-link" href="#" aria-label="Next">
                                                            <span aria-hidden="true">&raquo;</span>
                                                            <span class="sr-only">Last</span>
                                                        </button>
                                                    </li>
                                                </ul>
                                            </nav>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- :end section -->
                        
                </div>
            </div>
        </div>

    </div>
</div>

<!-- :start Add/Update Modal -->
<!-- Start Requirements Modal   -->
<div class="modal fade" id="modal_new_SUA_user" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <form [formGroup]="addNewForm">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel">
                        Add New User
                    </h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">
                            &times;
                        </span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="form-group m-form__group row">
                        <label for="example-text-input" class="col-4 col-form-label">Staff ID</label>
                        <div class="col-4">
                            <input type="text" maxlength="50" required class="form-control m-input" 
                            formControlName="SUuser" #infoTcYear id="infoTcYear">
                        </div>
                    </div>
                    <div class="form-group m-form__group row">
                        <label for="example-text-input" class="col-4 col-form-label">Password</label>
                        <div class="col-4">
                            <input type="password" maxlength="50" required class="form-control m-input" 
                            formControlName="SUPass" #infoTcYear id="infoTcYear">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal" (click)="resetForm()">
                        Close
                    </button>
                    <button [disabled]="!addNewForm.valid" type="submit" class="btn btn-primary"
                        onclick="$('.modal').modal('hide')" (click)="addUser()">
                        Save
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
<!-- :end Add/Update Modal -->

<button style="visibility: hidden" id="test"></button>
<app-sticky-nav-component></app-sticky-nav-component>
